# docflow capability manifest — the machine-readable record of this
# repo's docflow shape. Tools read this file instead of parsing
# CONVENTIONS.md; if the two disagree, this file wins and the audit
# reports the divergence. It sits inside the artefact root (discovery
# is unchanged: find the root, then read this file).
#
# schema: contract version. A tool that meets a schema newer than it
#   understands must refuse writes and say so. An absent file means a
#   pre-contract repo; tools apply pre-contract behaviour unchanged.
# model:  capability-first | two-shape | decisions+specs | decisions-only
#   capability-first: capability records live in the ADR catalogue (default)
#   two-shape:        capability + technology shapes, both in the catalogue
#   decisions+specs:  pure decision ADRs + living spec/<slug>.md records
#   decisions-only:   pure decision ADRs; capability content managed elsewhere
# layers: any of [plan, agent, glossary, constraints, goals, domains, federation]
# evidence-adopted-at: OPTIONAL — the commit at which this repo adopted
#   per-criterion verification evidence (CONVENTIONS §Verification
#   Evidence). Records last substantively edited before it are exempt
#   until edited. Absent = evidence not adopted.
# autonomy: OPTIONAL — the unattended grant, L0–L5 (CONVENTIONS
#   §Autonomy). Absent = no unattended grant recorded; attended
#   operation is unaffected either way. Moved only by an operator.
schema: 1
model: <model>
layers: [<layers>]
