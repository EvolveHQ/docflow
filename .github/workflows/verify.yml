name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/verify.mjs
      - run: node scripts/verify-mutations.mjs
      - run: node evals/run.mjs
      - run: python3 -B evals/hosts/test-run-host.py
      - run: python3 -B evals/hosts/test-pi-wave-events.py
      - run: node --test evals/hosts/test-seed-completion.mjs
