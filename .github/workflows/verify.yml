name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/verify.mjs
      - run: node scripts/verify-mutations.mjs
      - run: node evals/run.mjs
      - run: python3 -B evals/hosts/test-run-host.py
      - run: python3 -B evals/hosts/test-pi-wave-events.py
      - run: python3 -B evals/hosts/test-pi-claims.py
      - run: node --test evals/hosts/test-permission-denial.mjs
      - run: node --test evals/hosts/test-seed-completion.mjs
      - run: node --test evals/hosts/test-isolation-guard.mjs
      - run: node --test scripts/release-handoff/contract.test.mjs scripts/release-handoff/consumer.test.mjs
      - run: python3 -B scripts/release-handoff/extract_test.py
      - name: Validate workflow syntax and expressions
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
